<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>keyshot-mcp architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9198a1"/>
    </marker>
  </defs>

  <!-- Claude Code -->
  <rect x="20" y="70" width="200" height="110" rx="10" fill="#161b22" stroke="#9198a1" stroke-width="1.5"/>
  <text x="120" y="117" text-anchor="middle" font-size="19" font-weight="600" fill="#e6edf3">Claude Code</text>
  <text x="120" y="143" text-anchor="middle" font-size="14" fill="#9198a1">MCP client</text>

  <!-- stdio -->
  <line x1="222" y1="125" x2="308" y2="125" stroke="#9198a1" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="265" y="113" text-anchor="middle" font-size="13" fill="#e6edf3">stdio</text>
  <text x="265" y="145" text-anchor="middle" font-size="12" fill="#9198a1">JSON-RPC</text>

  <!-- server -->
  <rect x="310" y="70" width="220" height="110" rx="10" fill="#161b22" stroke="#9198a1" stroke-width="1.5"/>
  <text x="420" y="108" text-anchor="middle" font-size="19" font-weight="600" fill="#e6edf3">keyshotmcp</text>
  <text x="420" y="132" text-anchor="middle" font-size="14" fill="#9198a1">MCP server, Python 3.12</text>
  <text x="420" y="154" text-anchor="middle" font-size="14" fill="#9198a1">31 tools</text>

  <!-- TCP -->
  <line x1="532" y1="125" x2="698" y2="125" stroke="#9198a1" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="615" y="113" text-anchor="middle" font-size="13" fill="#e6edf3">TCP 127.0.0.1:1998</text>
  <text x="615" y="145" text-anchor="middle" font-size="12" fill="#9198a1">length + JSON</text>
  <text x="615" y="161" text-anchor="middle" font-size="12" fill="#9198a1">+ token</text>

  <!-- KeyShot -->
  <rect x="680" y="20" width="260" height="200" rx="12" fill="#2a2118" stroke="#a8774a" stroke-width="1.5"/>
  <text x="810" y="48" text-anchor="middle" font-size="16" font-weight="600" fill="#e3b382">KeyShot Studio</text>
  <rect x="700" y="70" width="220" height="110" rx="10" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
  <text x="810" y="104" text-anchor="middle" font-size="17" font-weight="600" fill="#e6edf3">MCP start (bridge)</text>
  <text x="810" y="129" text-anchor="middle" font-size="14" fill="#9198a1">timer on the UI thread</text>
  <text x="810" y="151" text-anchor="middle" font-size="14" fill="#9198a1">calls the lux API</text>

  <!-- pont-actif.json -->
  <rect x="330" y="255" width="420" height="50" rx="8" fill="none" stroke="#9198a1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="540" y="276" text-anchor="middle" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="#e6edf3">%LOCALAPPDATA%\keyshot-mcp\pont-actif.json</text>
  <text x="540" y="295" text-anchor="middle" font-size="12" fill="#9198a1">port, token, KeyShot PID</text>

  <path d="M810 182 V280 H752" fill="none" stroke="#9198a1" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="818" y="245" font-size="12" fill="#9198a1">writes</text>
  <line x1="420" y1="253" x2="420" y2="182" stroke="#9198a1" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="428" y="225" font-size="12" fill="#9198a1">reads</text>
</svg>
