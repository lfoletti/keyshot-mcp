name: Release

# A v* tag builds keyshot-mcp-<tag>-windows.zip: the add-in scripts, the MCP
# server, run.py and libs/ with mcp already installed for Windows and
# Python 3.12. If the release of the tag exists, the zip is added to it.
# If not, the workflow creates a draft release. A manual run attaches the
# zip to an existing tag, for example v1.0.0. A pull request that touches
# this file builds the zip and publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build and attach, for example v1.0.0
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - pyproject.toml

permissions:
  contents: read

jobs:
  zip:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.0.0-pr{0}', github.event.number)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install mcp in libs
        run: python -m pip install --target libs mcp==1.28.1

      - name: Check imports
        run: python -I -S run.py --check

      - name: Build the zip
        shell: pwsh
        run: |
          $name = "keyshot-mcp-$env:TAG-windows"
          New-Item -ItemType Directory "dist/$name" | Out-Null
          Copy-Item -Recurse addin, server, libs "dist/$name/"
          Copy-Item run.py, README.md, LICENSE, CHANGELOG.md "dist/$name/"
          Get-ChildItem -Recurse -Directory -Filter __pycache__ "dist/$name" | Remove-Item -Recurse -Force
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          # One line with a LF end, so that shasum -c and sha256sum -c read the file name.
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/$name.zip.sha256", "$hash  $name.zip`n")

      - name: Check the checksum file
        shell: bash
        run: cd dist && sha256sum -c *.zip.sha256

      - name: Attach to the release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.zip.sha256 --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.zip.sha256 --draft --verify-tag --title "keyshot-mcp $TAG" --generate-notes
          fi

  python-package:
    # The sdist and the wheel of the tag. On a tag, they go to the release
    # (after the zip job, which creates the draft when needed).
    needs: zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build==1.3.0
          python -m build

      - name: The version of the package is the version of the tag
        if: env.TAG != ''
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' server/keyshotmcp/__init__.py)
          test "v$v" = "$TAG" || { echo "package $v, tag $TAG"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/

      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber

  pypi:
    # Trusted publishing: no token. It runs only when the repository variable
    # PYPI_PUBLISH is "true", after the maintainer has added this workflow as
    # a trusted publisher of keyshot-mcp on pypi.org (environment "pypi").
    needs: python-package
    if: github.event_name != 'pull_request' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  mcp-registry:
    # server.json goes to the MCP registry after the package is on PyPI. The
    # registry checks the line mcp-name in the README of the PyPI package, and
    # the GitHub OIDC token proves the namespace io.github.lfoletti.
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          persist-credentials: false

      - name: Install mcp-publisher v1.8.4
        run: |
          base=https://github.com/modelcontextprotocol/registry/releases/download/v1.8.4
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "$base/registry_1.8.4_checksums.txt"
          grep ' mcp-publisher_linux_amd64.tar.gz$' registry_1.8.4_checksums.txt | sha256sum -c
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
