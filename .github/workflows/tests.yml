name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    # Le pont utilise la minuterie Windows (SetTimer).
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install mcp in libs
        run: python -m pip install --target libs mcp==1.28.1

      - name: Check imports
        run: python -I -S run.py --check

      - name: Bridge tests
        working-directory: tests
        run: python test_pont.py

      - name: End-to-end tests
        working-directory: tests
        run: python test_serveur_mcp.py
