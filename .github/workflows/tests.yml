name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    # Le pont utilise la minuterie Windows (SetTimer).
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install mcp in libs
        run: python -m pip install --target libs mcp==1.28.1

      - name: Check imports
        run: python -I -S run.py --check

      - name: Bridge tests
        working-directory: tests
        run: python test_pont.py

      - name: End-to-end tests
        working-directory: tests
        run: python test_serveur_mcp.py

      - name: Command tests
        working-directory: tests
        run: python test_cli.py

      - name: Publication files
        working-directory: tests
        run: python test_publication.py

      - name: Plugin files
        working-directory: tests
        run: python test_plugin.py

  package:
    # The PyPI package: build it, install it in a clean environment, run the command.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build==1.3.0
          python -m build

      - name: Install the wheel and run keyshot-mcp
        shell: bash
        run: |
          python -m venv venv
          venv/Scripts/python -m pip install dist/*.whl
          venv/Scripts/keyshot-mcp --version
          mkdir scripts
          venv/Scripts/keyshot-mcp install-addin --dir scripts
          cmp "scripts/MCP start.py" "addin/Scripts/MCP start.py"
          cmp "scripts/MCP stop.py" "addin/Scripts/MCP stop.py"
